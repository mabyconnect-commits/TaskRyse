# Full Taskryse stack: Postgres + Express API + nginx-served React frontend.
#
#   docker compose up --build
#   open http://localhost:8080   (demo login: adaeze@example.com / Password123!)
#
# The backend waits for Postgres, runs migrations, and seeds on first boot.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskryse
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskryse"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed for local inspection; not required by the other services.
    ports:
      - "5433:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/taskryse?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: production
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
